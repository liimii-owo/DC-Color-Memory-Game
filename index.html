<!DOCTYPE html>
<html>
<head>
    <title>Color Memory Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Color Memory Game</h1>

    <div id="colorBox"></div>

    <div class="sliderGroup">
        <label for="red">R: <span id="redValue">128</span></label>
        <input id="red" type="range" min="0" max="255" value="128">
    </div>

    <div class="sliderGroup">
        <label for="green">G: <span id="greenValue">128</span></label>
        <input id="green" type="range" min="0" max="255" value="128">
    </div>

    <div class="sliderGroup">
        <label for="blue">B: <span id="blueValue">128</span></label>
        <input id="blue" type="range" min="0" max="255" value="128">
    </div>

    <script src="main.js"></script>
</body>
</html>
